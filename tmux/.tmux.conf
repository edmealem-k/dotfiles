source-file ~/.tmux.reset.conf
# remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-a
bind-key C-k send-prefix

# split panes using h and v
bind v split-window -h
bind h split-window -v
unbind '"'
unbind %
# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf
# swiching panes using 
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -l
bind j resize-pane -D 5
bind k resize-pane -U 5
bind L resize-pane -R 5
bind H resize-pane -L 5

# set -g default-terminal "tmux-256color"
# set -as terminal-overrides ',xterm-256color:Tc'

# Kill entire window after selecting it with prefix + w
bind x kill-window

# Kill a single window directly with prefix + X
bind X confirm-before -p "Kill this window? (y/n)" kill-window

bind -r m resize-pane -Z

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# bind m set -g mouse \; display-message  -d 1000 "Mouse Mode Toggled" 

# Keybinding to rename window with 'prefix + ,'
bind-key , command-prompt "rename-window '%%'"

set -g base-index 1
set mouse on
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -gq allow-passthrough on
# set -g status-style 'bg=black'
# setw -g window-status-current-style 'fg=black bg=black'
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g clock-mode-style 12

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
# adding resurrect to respawn session during sudden shutdown
set -g @plugin 'tmux-plugins/tmux-resurrect'

# adding continuum to save session within interval
set -g @plugin 'tmux-plugins/tmux-continuum'
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'

# continuum restore on so it will save in 15 min
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# custom key binding for resurrect
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-r'

# save window size as it is and restore it as it is
set -g @resurrect-hook-post-save-all 'eval $(xdotool getwindowgeometry --shell $WINDOWID); echo 0,$X,$Y,$WIDTH,$HEIGHT > $HOME/.tmux/resurrect/geometry'
set -g @resurrect-hook-pre-restore-all 'wmctrl -i -r $WINDOWID -e $(cat $HOME/.tmux/resurrect/geometry)'

# adding copy on selected functionality for tmux
set -g @plugin 'tmux-plugins/tmux-yank'

# adding tmux-open to open anything by default app after selecting on select mode
set -g @plugin 'tmux-plugins/tmux-open'

# Vim motion keys on tmux
setw -g mode-keys vi

set -g @plugin 'christoomey/vim-tmux-navigator'

# set -g status-right "#[fg=colour245] CPU: #(top -bn1 | grep \"Cpu(s)\" | sed \"s/.*, *\\([0-9.]*\\)%* id.*/\\1/\" | awk '{print 100 - $1\"%\"}') #[fg=colour235]|#[fg=colour245] RAM: #(free | awk '/Mem:/ {printf \"%.1f/%.1fGB\", $3/1024/1024, $2/1024/1024}') #[fg=colour235]| #[fg=colour136]%Y-%m-%d #[fg=colour255,bold]%H:%M #[fg=colour51,bg=colour235,nobold]#[fg=colour232,bg=colour51,bold] #h "
# catppuccin
set -g @catppuccin_window_left_separator " █"
set -g @catppuccin_window_right_separator "█ "
set -g @plugin 'catppuccin/tmux#v2.1.1' # See https://github.com/catppuccin/tmux/tags for additional tags
# ...alongside
set -g @plugin 'tmux-plugins/tpm'
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
# set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " █"
set -g @catppuccin_status_right_separator "█ "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
# set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_date_time_text "%I:%M %P"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-right "#[fg=colour245] CPU: #(top -bn1 | grep \"Cpu(s)\" | sed \"s/.*, *\\([0-9.]*\\)%* id.*/\\1/\" | awk '{print 100 - $1\"%\"}') #[fg=colour235]|#[fg=colour245] RAM: #(free | awk '/Mem:/ {printf \"%.1f/%.1fGB\", $3/1024/1024, $2/1024/1024}') #[fg=colour235]| #[fg=colour136]%Y-%m-%d #[fg=colour255,bold]%H:%M #[fg=colour51,bg=colour235,nobold]#[fg=colour232,bg=colour51,bold] #h "
